<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <p th:text="${book.toString()}">value</p>

    <a th:href="@{/books/{id}/edit(id=${book.getId()})}">edit</a>
    <div th:if="${person == null or person.id == null}">
        <p>Эта книга свободна, кому назначить её?</p>
        <form th:method="patch" th:action="@{/books/{id}/addBook(id=${book.getId()})}">
            <label for="personSelect">Выберите человека:</label>
            <select id="personSelect" name="personId" required>
                <option value="">-- выберите --</option>
                <option th:each="p : ${people}"
                        th:value="${p.id}"
                        th:text="${p.name} + ' ' + ${p.surname}">person</option>
            </select>
            <button type="submit">Назначить книгу</button>
        </form>
    </div>

    <div th:if="${person != null and person.id != null}">
        <p>Книга сейчас у: <span th:text="${person.name} + ' ' + ${person.surname}"></span></p>
        <form th:method="patch" th:action="@{/books/{id}/release(id=${book.getId()})}">
            <button type="submit">Освободить книгу</button>
        </form>
    </div>

    <form th:method="delete" th:action="@{/books/{id}(id=${book.getId()})}">
        <input type="submit" value="Delete!">
    </form>

</body>
</html>
