<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>edit</title>
</head>
<body>
<form th:method="patch" th:action="@{/people/{id}(id=${person.getId()})}" th:object="${person}">
  <label for="name">Enter name: </label>
  <input type="text" th:field="*{name}" id="name">
  <div th:if="${#fields.hasErrors()}" th:errors="*{name}">error</div>
  <br>
  <label for="surname">Enter surname: </label>
  <input type="text" th:field="*{surname}" id="surname">
  <div th:if="${#fields.hasErrors()}" th:errors="*{surname}">error</div>
  <br>
  <label for="patronymic">Enter patronymic: </label>
  <input type="text" th:field="*{patronymic}" id="patronymic">
  <div th:if="${#fields.hasErrors()}" th:errors="*{patronymic}">error</div>
  <br>
  <label for="age">Enter age: </label>
  <input type="number" th:field="*{age}" id="age">
  <div th:if="${#fields.hasErrors()}" th:errors="*{age}">error</div>
  <br>
  <input type="submit" value="Update!">
</form>

</body>
</html>
